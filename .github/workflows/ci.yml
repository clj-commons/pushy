name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          lein: 2.11.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('project.clj') }}
          restore-keys: m2-

      - run: npm ci

      - run: lein test
